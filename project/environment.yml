name: public_safety
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel
  - tqdm
  - pillow
  - opencv
  - h5py
  - imageio
  - imageio-ffmpeg
  - pip
  - pip:
    - tensorflow==2.15.0
    - torch==2.11.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
    - torchvision==0.26.0+cpu --extra-index-url https://download.pytorch.org/whl/cpu
